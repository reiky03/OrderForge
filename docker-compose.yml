services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_NAME: ${APP_NAME:-OrderForge}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://127.0.0.1:8000}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-orderforge}
      DB_USERNAME: ${POSTGRES_USER:-orderforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderforge-local}
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-orderforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-orderforge-local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-orderforge-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-orderforge-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_EXCHANGE: orderforge.events
      RABBITMQ_QUEUE: orderforge.events.all
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-only-change-me}
      ORDERFORGE_DEMO_PASSWORD: ${ORDERFORGE_DEMO_PASSWORD:-OrderForgeLocal2026!}
      ORDER_EXPIRATION_MINUTES: ${ORDER_EXPIRATION_MINUTES:-15}
      IDEMPOTENCY_TTL_HOURS: ${IDEMPOTENCY_TTL_HOURS:-24}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    command: >
      sh -c "[ -f .env ] || cp .env.example .env;
      if [ ! -f vendor/autoload.php ] || ! cmp -s composer.lock vendor/.orderforge-composer.lock; then
      composer install --no-interaction --prefer-dist && cp composer.lock vendor/.orderforge-composer.lock || exit 1; fi;
      if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
      php artisan migrate --force &&
      php-fpm -F"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-orderforge}
      DB_USERNAME: ${POSTGRES_USER:-orderforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderforge-local}
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-orderforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-orderforge-local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-orderforge-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-orderforge-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    command: sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done; php artisan queue:work --tries=3 --sleep=2"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-orderforge}
      DB_USERNAME: ${POSTGRES_USER:-orderforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderforge-local}
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-orderforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-orderforge-local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-orderforge-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-orderforge-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    command: sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done; php artisan schedule:work"
    depends_on:
      postgres:
        condition: service_healthy

  events:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-orderforge}
      DB_USERNAME: ${POSTGRES_USER:-orderforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-orderforge-local}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-orderforge}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-orderforge-local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-orderforge-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-orderforge-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    command: sh -c "until php artisan migrate:status >/dev/null 2>&1; do sleep 2; done; php artisan events:consume --sleep=2"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderforge}
      POSTGRES_USER: ${POSTGRES_USER:-orderforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderforge-local}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-orderforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-orderforge-local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 && nc -z 127.0.0.1 15672"]
      interval: 30s
      timeout: 15s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8000}/api/v1
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
        NEXT_PUBLIC_REVERB_HOST: 127.0.0.1
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-8085}
        NEXT_PUBLIC_REVERB_SCHEME: http
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8000}/api/v1
      NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      NEXT_PUBLIC_REVERB_HOST: 127.0.0.1
      NEXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-8085}
      NEXT_PUBLIC_REVERB_SCHEME: http
      API_INTERNAL_URL: http://nginx/health/ready
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - nginx
      - reverb

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-orderforge-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-orderforge-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-orderforge-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_ALLOWED_ORIGINS: localhost,127.0.0.1
    volumes:
      - ./backend:/var/www:ro
      - backend_vendor:/var/www/vendor
    command: sh -c "until test -f .env && test -f vendor/laravel/reverb/src/Reverb.php; do sleep 2; done; php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "${REVERB_PORT:-8085}:8080"
    depends_on:
      app:
        condition: service_started

volumes:
  backend_vendor:
  postgres_data:
  redis_data:
  rabbitmq_data:
